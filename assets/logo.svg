<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Inkpad">
  <title>Inkpad</title>
  <desc>A silver pen with a four-pointed star for fins and a blue thrust flame, drifting through deep space.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13223c"/>
      <stop offset="0.45" stop-color="#0a1526"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f9b457"/>
      <stop offset="0.6" stop-color="#f09330"/>
      <stop offset="1" stop-color="#e07a22"/>
    </radialGradient>

    <!-- pen barrel: chrome, lit from the upper left -->
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8ba5"/>
      <stop offset="0.12" stop-color="#e8eefb"/>
      <stop offset="0.28" stop-color="#c2cddf"/>
      <stop offset="0.46" stop-color="#6d7b96"/>
      <stop offset="0.58" stop-color="#94a1ba"/>
      <stop offset="0.8" stop-color="#eef3fc"/>
      <stop offset="1" stop-color="#8a97b1"/>
    </linearGradient>
    <linearGradient id="penDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5670"/>
      <stop offset="0.25" stop-color="#aeb9ce"/>
      <stop offset="0.5" stop-color="#5b6884"/>
      <stop offset="0.8" stop-color="#9aa6bd"/>
      <stop offset="1" stop-color="#3f4a63"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9cb6"/>
      <stop offset="0.2" stop-color="#f4f8ff"/>
      <stop offset="0.55" stop-color="#b9c4d8"/>
      <stop offset="1" stop-color="#6d7a95"/>
    </linearGradient>
    <!-- star sits behind the pen: same metal, a shade deeper -->
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe3f2"/>
      <stop offset="0.5" stop-color="#9aa7c0"/>
      <stop offset="1" stop-color="#6a7791"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#1f6fc4"/>
      <stop offset="0.45" stop-color="#3f9ae8"/>
      <stop offset="1" stop-color="#7fd0ff"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.5" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- deep space -->
  <rect width="512" height="512" fill="url(#space)"/>

  <!-- orbital arcs -->
  <g fill="none" stroke="#8fb4e8" stroke-width="1.4" opacity="0.07">
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="212"/>
    <circle cx="256" cy="256" r="276"/>
  </g>

  <!-- small planets -->
  <g>
    <circle cx="168" cy="252" r="24" fill="#2f7fd0" opacity="0.9"/>
    <circle cx="612" cy="196" r="9" fill="#6b7689"/>
    <circle cx="270" cy="100" r="13" fill="#2f7fd0" opacity="0.85"/>
    <circle cx="448" cy="358" r="26" fill="#8a6a4e" opacity="0.9"/>
    <circle cx="60" cy="60" r="4" fill="#cfdcf5" opacity="0.7"/>
    <circle cx="470" cy="86" r="3" fill="#cfdcf5" opacity="0.5"/>
    <circle cx="118" cy="446" r="3.5" fill="#cfdcf5" opacity="0.45"/>
  </g>

  <!-- sun rising in the lower-left corner -->
  <circle cx="-72" cy="566" r="250" fill="url(#sun)"/>

  <g transform="translate(258 256) rotate(45) translate(-256 -230) scale(0.9)">
    <!-- thrust flame -->
    <path d="M 232 100 Q 248 24 306 -46 Q 274 28 284 100 Z" fill="url(#flame)"/>
    <path d="M 248 100 Q 256 42 288 -12 Q 270 38 272 100 Z" fill="url(#flameCore)"/>

    <!-- four-point star: the fins, behind the pen -->
    <path d="M 256 74 Q 275 186 392 210 Q 275 234 256 346 Q 237 234 120 210 Q 237 186 256 74 Z"
          fill="url(#star)"/>

    <!-- pen back cap -->
    <rect x="226" y="92" width="60" height="34" rx="13" fill="url(#penDark)"/>
    <!-- barrel -->
    <path d="M 220 312 L 220 128 Q 220 108 240 108 L 272 108 Q 292 108 292 128 L 292 312 Z" fill="url(#pen)"/>
    <!-- grip taper toward the nib -->
    <path d="M 220 312 L 292 312 L 278 364 L 234 364 Z" fill="url(#pen)"/>
    <!-- collar band -->
    <rect x="224" y="298" width="64" height="20" rx="6" fill="url(#penDark)" opacity="0.85"/>
    <!-- clip -->
    <path d="M 230 140 Q 218 146 218 160 L 218 244 Q 218 258 230 258" fill="none" stroke="#eef3fc" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <!-- nib -->
    <path d="M 234 364 L 278 364 L 256 430 Z" fill="url(#nib)"/>
    <path d="M 256 430 L 256 400" stroke="#f8fbff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
