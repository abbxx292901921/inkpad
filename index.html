<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Inkpad</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <!-- iOS home screen icon -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- The editor: canvases + floating toolbar. -->
  <div id="editor" class="screen">
    <!-- The PAPER canvas: page sheets, ruling and imported layers. It sits
         under the ink so translucent ink can composite against the ink only. -->
    <canvas id="paper" aria-hidden="true"></canvas>
    <canvas id="page" aria-label="Note-taking canvas. Draw with pen, touch, or mouse."></canvas>
    <!-- Document scrollbar. Built by src/app.js. -->
    <div id="scrollbar" class="scrollbar" hidden>
      <div id="scrollbar-thumb" class="scrollbar-thumb"></div>
    </div>
    <!-- Toolbar: built by src/ui/toolbar.js (floating pills). -->
    <div id="toolbar" class="toolbar"></div>
    <!-- Bottom-centre page navigator, docked by src/app.js. -->
    <div id="bottomnav" class="bottomnav"></div>
  </div>

  <!-- The library: built by src/ui/library.js. -->
  <div id="library" class="screen" hidden></div>

  <!-- File importer. Images become page layers (written on top of). -->
  <input id="file-input" type="file" accept="image/*,application/pdf" hidden>

  <!-- Transient messages. -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Apple Pencil hover cursor ring (pointer-events: none). -->
  <div id="penring" class="penring" hidden></div>

  <!-- Debug overlay (key "D"). pointer-events:none via CSS. -->
  <div id="debug" class="debug" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
